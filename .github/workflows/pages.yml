name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site (배포 제외 대상 정리)
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_workdir' --exclude 'tools' ./ /tmp/site/

      - name: Setup Pages (최초 실행 시 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
